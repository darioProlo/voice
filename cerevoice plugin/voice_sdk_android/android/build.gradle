group 'com.example.voice_sdk_android'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '1.6.10'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.1.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'


android {
    compileSdkVersion 33

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
        main.jniLibs.srcDirs = ['src/main/cpp/jniLibs']
    }

    defaultConfig {
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++11 -fexceptions -frtti"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        //applicationId "com.example.voice_sdk_android"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-build-configuration.
        minSdkVersion 21
        targetSdkVersion 33
        multiDexEnabled true
        versionCode 1
        versionName '1.0.0'



        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86"
        }

    }

    packagingOptions {
        pickFirst "**/libc++_shared.so"
        pickFirst "**/libdlib.so"
    }

    ndkVersion '19.2.5345600'

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.18.1'
        }
    }
}

dependencies {
    def multidex_version = "2.0.1"
    implementation "androidx.multidex:multidex:$multidex_version"

    implementation fileTree(dir: 'cpp', include: ['*.jar', '*.so'])
    implementation files('src/main/cpp/libs/arm64-v8a/cerevoice_eng.jar')
//    implementation files('src/main/cpp/libs/armeabi-v7a/cerevoice_eng.jar')
//    implementation files('src/main/cpp/libs/x86/cerevoice_eng.jar')
//    implementation files('src/main/cpp/libs/x86_64/cerevoice_eng.jar')
}